name: Perform a Disaster Recovery Step

concurrency:
  group: disaster-recovery-steps
  cancel-in-progress: false

on:
  pull_request:

  workflow_dispatch:
    inputs:
      Action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - backup
          - failover
          - commit
          - switch
          - reset
          - test_failover
          - test_cleanup
      Direction:
        description: 'Direction of DR'
        required: true
        type: choice
        options:
          - PrimaryToRecovery
          - RecoveryToPrimary
      RunType:
        description: 'Type of run to execute'
        required: true
        type: choice
        options:
          - Plan
          - Apply
  
jobs:
  create-workspace:
    name: Create Failover Execution Workspace
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' 
    uses: ./.github/workflows/create-workspace.yaml
    with:
      organization: sean-kearsley-priv-tenant
      workspace_name: ${{ github.event.repository.name }}
      workspace_project: Azure
    secrets:
      TFC_TOKEN: ${{ secrets.TF_REGISTRY_TOKEN }}

  tf-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: [create-workspace]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/tf-plan-cli.yaml
    with:
      TF_WORKSPACE: ${{ github.event.repository.name }}
      tfc_organization: sean-kearsley-priv-tenant
      TF_VARS_FILE: env/recovery.auto.tfvars
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}
      TF_VARS_INJECTION: |
        dr_failover_action = "${{ github.event_name == 'pull_request' && 'reset' || github.event.inputs.Action }}"
        dr_direction       = "${{ github.event_name == 'pull_request' && 'PrimaryToRecovery' || github.event.inputs.Direction }}"
        backup_request_id  = "${{ github.run_id }}-${{ github.run_attempt }}"
    secrets:
      TFC_TOKEN: ${{ secrets.TF_REGISTRY_TOKEN }}

  approval:
    name: Approval Gate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.RunType == 'Apply'
    needs: [tf-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - name: Await repo collaborator approval
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueTitle = `DR Apply Approval: ${context.runId}`;
            const issueBody = [
              'Approve or deny this disaster recovery apply run by commenting on this issue.',
              '',
              `Action: ${context.payload.inputs.Action}`,
              `Direction: ${context.payload.inputs.Direction}`,
              `Triggered by: ${context.actor}`,
              '',
              'Allowed approvers: any repository collaborator with write, maintain, or admin access.',
              'Approval keywords: approve, approved, lgtm, yes',
              'Denial keywords: deny, denied, no'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body: issueBody
            });

            const issue_number = issue.data.number;
            core.info(`Created approval issue #${issue_number}`);

            const approvedWords = ['approve', 'approved', 'lgtm', 'yes'];
            const deniedWords = ['deny', 'denied', 'no'];
            const permissionCache = new Map();

            const hasWord = (body, words) => {
              const normalized = (body || '').toLowerCase();
              return words.some((word) => {
                const regex = new RegExp(`(^|\\s)${word}[!.]?(\\s|$)`, 'i');
                return regex.test(normalized);
              });
            };

            const hasApprovalPermission = async (username) => {
              if (permissionCache.has(username)) {
                return permissionCache.get(username);
              }

              try {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username
                });
                const level = permission.data.permission;
                const allowed = ['write', 'maintain', 'admin'].includes(level);
                permissionCache.set(username, allowed);
                return allowed;
              } catch {
                permissionCache.set(username, false);
                return false;
              }
            };

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const timeoutMs = 175 * 60 * 1000;
            const started = Date.now();

            while (Date.now() - started < timeoutMs) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              for (const comment of comments) {
                const username = comment.user?.login;
                if (!username) {
                  continue;
                }

                const isApprover = await hasApprovalPermission(username);
                if (!isApprover) {
                  continue;
                }

                if (hasWord(comment.body, deniedWords)) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body: `Denied by @${username}. Failing this workflow.`
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number,
                    state: 'closed'
                  });
                  core.setFailed(`Denied by ${username}`);
                  return;
                }

                if (hasWord(comment.body, approvedWords)) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body: `Approved by @${username}. Continuing workflow.`
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number,
                    state: 'closed'
                  });
                  core.info(`Approved by ${username}`);
                  return;
                }
              }

              await sleep(15000);
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: 'Approval timed out. Failing workflow.'
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed'
            });
            core.setFailed('Approval timed out');

  tf-apply:
    name: Terraform Apply
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.RunType == 'Apply'
    needs: [approval]
    permissions:
      contents: read
    uses: ./.github/workflows/tf-apply-cli.yaml
    with:
      TF_WORKSPACE: ${{ github.event.repository.name }}
      tfc_organization: sean-kearsley-priv-tenant
      TF_VARS_FILE: env/recovery.auto.tfvars
      TF_VARS_INJECTION: |
        dr_failover_action = "${{ github.event.inputs.Action }}"
        dr_direction       = "${{ github.event.inputs.Direction }}"
        backup_request_id  = "${{ github.run_id }}-${{ github.run_attempt }}"
    secrets:
      TFC_TOKEN: ${{ secrets.TF_REGISTRY_TOKEN }}